<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; width: 200px; background: #2f3136; color: #dcddde; margin: 0; }
    h3 { font-size: 14px; margin-top: 0; margin-bottom: 10px; color: #ffffff; }
    label { font-size: 12px; display: block; margin-bottom: 5px; }
    select { width: 100%; padding: 6px; background: #40444b; color: #fff; border: 1px solid #202225; border-radius: 4px; outline: none; }
  </style>
</head>
<body>
  <h3>Discord Translator</h3>
  <label for="lang">Target Language:</label>
  <select id="lang">
    <option value="en">English</option>
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="ja">Japanese</option>
    <option value="zh">Chinese</option>
    <option value="hi">Hindi</option>
  </select>
  <script src="popup.js"></script>
</body>
</html>
